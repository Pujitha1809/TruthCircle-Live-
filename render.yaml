# ==========================================
# Render Blueprint Specification for TruthCircle
# Deploy with 1-click on https://render.com
# ==========================================

services:
  - type: web
    name: truthcircle-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: SERPAPI_API_KEY
        sync: false
      - key: YOU_API_KEY
        sync: false
      - key: YDC_API_KEY
        sync: false
      - key: NEXCONN_APP_ID
        sync: false
      - key: NEXCONN_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
